name: Bug report
description: Something is broken or behaves unexpectedly
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Place the component on the canvas
        2. ...
    validations:
      required: true
  - type: input
    id: rhino-version
    attributes:
      label: Rhino version
      placeholder: "Rhino 8 SR12"
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: PARAMANIACS version
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - macOS
        - Other
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or logs (optional)
